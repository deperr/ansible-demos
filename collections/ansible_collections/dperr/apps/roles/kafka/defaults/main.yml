---

# Specify the Kafka and Scala version
# Ensure Scala version is compatable with Kafka version
kafka_version: "3.7.0"
scala_version: "2.13"

# Set Kafka directories
kafka_install_dir: "/opt/kafka"
kafka_data_dir: "/var/lib/kafka"

# Set Zookeeper directory
zookeeper_data_dir: "/var/lib/zookeeper" # For internal Zookeeper or KRaft

# Set Java home directory
java_home: "/usr/lib/jvm/jre-11-openjdk" # Adjust based on your Java installation

kafka_mode: "zookeeper"
