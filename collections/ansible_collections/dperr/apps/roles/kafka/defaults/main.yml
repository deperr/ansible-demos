---
kafka_version: "3.7.0"
scala_version: "2.13"

kafka_dir: "/opt/kafka"
kafka_data_dir: "/var/lib/kafka-logs"

kafka_user: "kafka"

kafka_topic: "eda-topic"
# Uses the node's primary network IP so AAP can reach it
kafka_bind_ip: "{{ ansible_default_ipv4.address }}"

kafka_kraft_properties:
  log.dirs: "{{ kafka_data_dir }}"
  listeners: "PLAINTEXT://{{ kafka_bind_ip }}:9092,CONTROLLER://{{ kafka_bind_ip }}:9093"
  advertised.listeners: "PLAINTEXT://{{ kafka_bind_ip }}:9092"
  controller.quorum.voters: "1@{{ kafka_bind_ip }}:9093"
  offsets.topic.replication.factor: "1"
  transaction.state.log.replication.factor: "1"
  transaction.state.log.min.isr: "1"
