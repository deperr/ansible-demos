---

- name: Install Java (OpenJDK 17) and archiving tools
  ansible.builtin.dnf:
    name:
      - java-17-openjdk
      - tar
      - gzip
    state: present

- name: Create Kafka group
  ansible.builtin.group:
    name: "{{ kafka_user }}"
    state: present

- name: Create Kafka user
  ansible.builtin.user:
    name: "{{ kafka_user }}"
    group: "{{ kafka_user }}"
    system: true
    create_home: false

- name: Create Kafka installation and data directories
  loop:
    - "{{ kafka_dir }}"
    - "{{ kafka_data_dir }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ kafka_user }}"
    group: "{{ kafka_user }}"
    mode: '0755'

- name: Download and extract Apache Kafka (From Permanent Archive)
  ansible.builtin.unarchive:
    src: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_{{ scala_version }}-{{ kafka_version }}.tgz"
    dest: "{{ kafka_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    owner: "{{ kafka_user }}"
    group: "{{ kafka_user }}"
    creates: "{{ kafka_dir }}/bin/kafka-server-start.sh"

- name: Configure KRaft properties (Network, IP, and Logging)
  loop: "{{ kafka_kraft_properties | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  ansible.builtin.lineinfile:
    path: "{{ kafka_dir }}/config/kraft/server.properties"
    regexp: "^#?{{ item.key | regex_escape() }}="
    line: "{{ item.key }}={{ item.value }}"

- name: Check if KRaft storage is already formatted
  register: kraft_meta
  ansible.builtin.stat:
    path: "{{ kafka_data_dir }}/meta.properties"

- name: Generate Kafka Cluster UUID
  register: kafka_uuid
  when: not kraft_meta.stat.exists
  become_user: "{{ kafka_user }}"
  ansible.builtin.command: "{{ kafka_dir }}/bin/kafka-storage.sh random-uuid"

- name: Format KRaft storage
  when: not kraft_meta.stat.exists
  become_user: "{{ kafka_user }}"
  ansible.builtin.command: >
    {{ kafka_dir }}/bin/kafka-storage.sh format
    -t {{ kafka_uuid.stdout }}
    -c {{ kafka_dir }}/config/kraft/server.properties

- name: Create Kafka systemd service
  notify: Reload systemd
  ansible.builtin.template:
    src: kafka.service.j2
    dest: /etc/systemd/system/kafka.service
    owner: root
    group: root
    mode: '0644'

- name: Start and enable Kafka service
  ansible.builtin.systemd:
    name: kafka
    state: started
    enabled: true
    daemon_reload: true

- name: Open firewall ports for Kafka and KRaft Controller
  loop:
    - 9092/tcp
    - 9093/tcp
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
