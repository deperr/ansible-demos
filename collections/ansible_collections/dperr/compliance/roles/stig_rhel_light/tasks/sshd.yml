---

- name: Ensure openssh-server is installed
  ansible.builtin.dnf:
    name:
      - openssh-server
      - openssh-clients
    state: present

- name: Deploy DOD Standard Mandatory Notice and Consent Banner
  ansible.builtin.copy:
    content: "{{ sshd_banner_content }}"
    dest: "{{ sshd_banner_path }}"
    owner: root
    group: root
    mode: '0644'

- name: Deploy STIG-compliant sshd configuration
  notify: Restart sshd
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0600'
    validate: /usr/sbin/sshd -t -f %s

- name: Start and enable sshd service
  ansible.builtin.systemd:
    name: sshd
    state: started
    enabled: true
