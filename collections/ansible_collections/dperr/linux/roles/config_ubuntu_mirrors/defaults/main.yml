---

# Profiles that determine which mirrors to configure.
# Valid values: 'ubuntu', 'docker_ce'
config_client_mirrors_profiles: []

# Enable removal of external sources (locks to internal mirrors only)
config_client_mirrors_external_sources_enabled: false

# --- Ubuntu mirror settings ---

# Base URL of your mirror. Override via extra-vars or survey.
config_client_mirrors_ubuntu_base_url: "http://{{ mirror_server_hostname | default('ubuntu-svr-01.dperrone.dev') }}/ubuntu"

# Space-separated suite names (adjust if your mirror only publishes a subset).
config_client_mirrors_ubuntu_suites: >-
  {{ ansible_distribution_release }}
  {{ ansible_distribution_release }}-updates
  {{ ansible_distribution_release }}-backports
  {{ ansible_distribution_release }}-security

# Used in deb822 templates (Ubiquity/ubuntu-keyring package).
config_client_mirrors_ubuntu_signed_by: /usr/share/keyrings/ubuntu-archive-keyring.gpg

# --- Docker mirror settings ---

# Base URL of your mirror host (no trailing slash). Override via extra-vars or survey.
config_client_mirrors_docker_origin: "http://{{ mirror_server_hostname | default('ubuntu-svr-01.dperrone.dev') }}"

# Path nginx serves for the Docker mirror (must match ubuntu_mirror_server URL path).
config_client_mirrors_docker_path: "/linux/ubuntu"

config_client_mirrors_docker_codename: noble
config_client_mirrors_docker_channel: stable
config_client_mirrors_docker_arch: amd64

# Official Docker archive signing key (fetched once onto the client).
config_client_mirrors_docker_key_url: https://download.docker.com/linux/ubuntu/gpg
config_client_mirrors_docker_signed_by: /etc/apt/keyrings/docker.asc

# --- External sources cleanup settings ---

# Only source files containing this origin are kept. Everything else in
# /etc/apt/sources.list.d/ is removed. Matched against file contents.
config_client_mirrors_external_sources_allowed_origin: "{{ mirror_server_hostname | default('ubuntu-svr-01.dperrone.dev') }}"

# Also blank /etc/apt/sources.list (Ubuntu default OS sources).
# Set to false if you still want the OS to reach archive.ubuntu.com.
config_client_mirrors_external_sources_disable_sources_list: true
