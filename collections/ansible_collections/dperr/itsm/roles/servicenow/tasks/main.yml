---
# This role has no default action on purpose. Every caller must name one, so that
# grepping for `tasks_from:` finds every place the ticket is touched.
- name: Refuse to run without an explicit action
  ansible.builtin.fail:
    msg: >-
      The dperr.itsm.servicenow role must be invoked with an explicit action, e.g.
      `include_role: {name: dperr.itsm.servicenow, tasks_from: note}`.
      Available actions: open, note.
